name: Tests and container smoke

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify dependencies and tests
        run: |
          python -m pip check
          python -m unittest discover -s tests -v
          python scripts/build_submission.py
      - name: Build and start local-only demo
        run: |
          mkdir -p data
          docker compose config --quiet
          docker compose up --build --detach --wait --wait-timeout 120
      - name: Check HTTP and persistent SQLite
        run: |
          curl --fail --silent http://127.0.0.1:8000/api/health
          curl --fail --silent -X POST http://127.0.0.1:8000/api/sessions > /tmp/mts-session.json
          docker compose restart
          docker compose up --detach --wait --wait-timeout 60
          python - <<'PY'
          import json
          import urllib.request
          from pathlib import Path
          identifier = json.loads(Path('/tmp/mts-session.json').read_text())['id']
          with urllib.request.urlopen(f'http://127.0.0.1:8000/api/sessions/{identifier}', timeout=10) as response:
              assert json.load(response)['id'] == identifier
          PY
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Stop test containers
        if: always()
        run: docker compose down
