services:
  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      MAX_TOKENS: ${MAX_TOKENS:-1200}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - type: bind
        source: ./data
        target: /app/data
        read_only: true
        bind:
          create_host_path: false
      - session-data:/app/state
volumes:
  session-data:
